version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
